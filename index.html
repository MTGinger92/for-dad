<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161614">
<title>For Dad · October 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-base: #161614;
    --surface-mid: #252520;
    --teal: #326E6E;
    --teal-warm: #4A9A9A;
    --gold: #C4A87A;
    --linen: #F5F0E8;
    --linen-mid: #E8E0CC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface-base); color: var(--linen); }
  body {
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 16px 64px;
    text-align: center;
  }
  .video-wrap {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    aspect-ratio: 9 / 16;
    background: var(--surface-mid);
  }
  video { width: 100%; height: 100%; display: block; background: var(--surface-mid); }
  .dates {
    margin: 24px 0 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .nw { white-space: nowrap; }
  @media (max-width: 420px) { .dates { letter-spacing: 2px; font-size: 11px; line-height: 2; } }
  blockquote { margin: 48px auto 0; max-width: 520px; }
  blockquote p {
    margin: 0;
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.45;
    color: var(--linen-mid);
  }
  cite {
    display: block;
    margin-top: 14px;
    font-style: normal;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .rule { width: 60px; height: 1px; background: var(--gold); margin: 48px auto 0; border: 0; }
  .btn {
    display: inline-block;
    margin-top: 40px;
    padding: 15px 32px;
    background: var(--teal);
    color: var(--linen);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: background .2s ease;
  }
  .btn:hover, .btn:focus-visible { background: var(--teal-warm); }
  .btn:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
  @media (min-width: 700px) {
    main { padding-top: 64px; }
    blockquote p { font-size: 30px; }
  }
</style>
</head>
<body>
<main>
  <div class="video-wrap">
    <video src="dad-birthday.mp4" controls playsinline preload="metadata" poster="poster.jpg"></video>
  </div>

  <p class="dates"><span class="nw">Joseph L. Abbrescia</span> · <span class="nw">October 1, 1936</span></p>

  <blockquote>
    <p>&ldquo;Nothing in life happens until you show up.&rdquo;</p>
    <cite>&mdash; Joseph L. Abbrescia</cite>
  </blockquote>

  <hr class="rule">

  <a class="btn" href="https://www.instagram.com/abbresciaart/">See What We Built</a>
</main>
</body>
</html>
